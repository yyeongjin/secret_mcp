<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light" />
    <title>Secret MCP Design Index Viewer</title>
    <link rel="stylesheet" href="/assets/styles.css" />
  </head>
  <body>
    <header class="topbar">
      <div class="brand">
        <span class="brand-mark" aria-hidden="true">
          <i data-lucide="panels-top-left"></i>
        </span>
        <div>
          <h1>Secret MCP</h1>
          <p>Design Index Viewer</p>
        </div>
      </div>
      <div class="topbar-actions">
        <div class="language-switch" role="group" aria-label="Interface language" data-i18n-aria-label="interfaceLanguage">
          <button class="language-option is-active" type="button" data-language="en" aria-pressed="true">EN</button>
          <button class="language-option" type="button" data-language="ko" aria-pressed="false">한국어</button>
        </div>
        <button
          class="icon-button exclusion-button"
          id="exclusionsButton"
          type="button"
          title="Search exclusion list"
          aria-label="Search exclusion list"
          data-i18n-title="exclusionList"
          data-i18n-aria-label="exclusionList"
        >
          <i data-lucide="list-x"></i>
          <span class="exclusion-count" id="exclusionCount">0</span>
        </button>
        <div class="connection" id="connectionState" aria-live="polite">
          <span class="connection-dot"></span>
          <span data-i18n="checkingConnection">Checking connection</span>
        </div>
        <button
          class="icon-button"
          id="refreshButton"
          type="button"
          title="Refresh"
          aria-label="Refresh"
          data-i18n-title="refresh"
          data-i18n-aria-label="refresh"
        >
          <i data-lucide="refresh-cw"></i>
        </button>
      </div>
    </header>

    <div class="workspace">
      <aside class="runs-pane" aria-label="Generation runs" data-i18n-aria-label="generationRuns">
        <div class="pane-heading">
          <div>
            <span class="eyebrow">RUNS</span>
            <h2 data-i18n="generationRuns">Generation runs</h2>
          </div>
          <span class="count" id="runCount">0</span>
        </div>
        <div class="run-list" id="runList"></div>
        <div class="watch-path" id="watchPath"></div>
      </aside>

      <section class="references-pane" aria-label="Per-work documents" data-i18n-aria-label="perWorkDocuments">
        <div class="run-overview" id="runOverview"></div>
        <div class="reference-list" id="referenceList"></div>
      </section>

      <main class="viewer-pane">
        <div class="viewer-header" id="viewerHeader"></div>
        <nav class="viewer-tabs" id="viewerTabs" aria-label="Work information" data-i18n-aria-label="workInformation">
          <button type="button" data-tab="document" class="tab is-active">
            <i data-lucide="file-text"></i>
            <span data-i18n="specification">Specification</span>
          </button>
          <button type="button" data-tab="evidence" class="tab">
            <i data-lucide="images"></i>
            <span data-i18n="evidence">Evidence</span>
          </button>
          <button type="button" data-tab="contract" class="tab">
            <i data-lucide="scroll-text"></i>
            <span data-i18n="requestContract">Request contract</span>
          </button>
          <button type="button" data-tab="events" class="tab">
            <i data-lucide="activity"></i>
            <span data-i18n="generationLog">Generation log</span>
          </button>
        </nav>
        <div class="viewer-content" id="viewerContent"></div>
      </main>
    </div>

    <dialog class="image-dialog" id="imageDialog">
      <div class="dialog-toolbar">
        <div id="dialogTitle"></div>
        <div class="dialog-actions">
          <button
            class="icon-button"
            id="zoomOutButton"
            type="button"
            title="Zoom out"
            aria-label="Zoom out"
            data-i18n-title="zoomOut"
            data-i18n-aria-label="zoomOut"
          >
            <i data-lucide="zoom-out"></i>
          </button>
          <span class="zoom-value" id="zoomValue">100%</span>
          <button
            class="icon-button"
            id="zoomInButton"
            type="button"
            title="Zoom in"
            aria-label="Zoom in"
            data-i18n-title="zoomIn"
            data-i18n-aria-label="zoomIn"
          >
            <i data-lucide="zoom-in"></i>
          </button>
          <button
            class="icon-button"
            id="closeDialogButton"
            type="button"
            title="Close"
            aria-label="Close"
            data-i18n-title="close"
            data-i18n-aria-label="close"
          >
            <i data-lucide="x"></i>
          </button>
        </div>
      </div>
      <div class="dialog-canvas">
        <img id="dialogImage" alt="" />
      </div>
    </dialog>

    <dialog class="exclusions-dialog" id="exclusionsDialog">
      <div class="exclusions-dialog-header">
        <div>
          <span class="eyebrow">FILTER</span>
          <h2 data-i18n="exclusionList">Search exclusion list</h2>
        </div>
        <button
          class="icon-button"
          id="closeExclusionsButton"
          type="button"
          title="Close"
          aria-label="Close"
          data-i18n-title="close"
          data-i18n-aria-label="close"
        >
          <i data-lucide="x"></i>
        </button>
      </div>
      <div class="exclusion-list" id="exclusionList"></div>
      <div class="exclusions-path" id="exclusionsPath"></div>
    </dialog>

    <div class="toast" id="toast" role="status" aria-live="polite"></div>

    <script src="/vendor/lucide.min.js"></script>
    <script type="module" src="/assets/app.js"></script>
  </body>
</html>
