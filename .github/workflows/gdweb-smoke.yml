name: GDWEB Smoke Test

on:
  workflow_dispatch:
    inputs:
      query:
        description: Design search query
        required: false
        default: 디자인 트렌드 웹사이트
      year:
        description: Target year. Leave empty to use current year.
        required: false
        default: ''

permissions:
  contents: read

jobs:
  smoke:
    name: Search GDWEB Designs
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install chromium firefox

      - name: Build
        run: npm run build

      - name: Run GDWEB smoke search
        env:
          QUERY: ${{ inputs.query }}
          YEAR: ${{ inputs.year }}
        run: |
          node -e "
            const { SearchEngine } = await import('./dist/search-engine.js');
            const { GdwebDesignSearch } = await import('./dist/gdweb-design-search.js');
            const engine = new SearchEngine();
            const gdweb = new GdwebDesignSearch(engine);
            const year = process.env.YEAR ? Number(process.env.YEAR) : undefined;
            const results = await gdweb.search({
              query: process.env.QUERY || '디자인 트렌드 웹사이트',
              limit: 5,
              year,
              awardOnly: true,
              includePreviousYear: true
            });
            console.log(JSON.stringify(results.map((result) => ({
              title: result.title,
              siteUrl: result.siteUrl,
              gdwebUrl: result.gdwebUrl,
              registeredDate: result.registeredDate,
              award: result.award,
              concept: result.concept,
              primaryColor: result.primaryColor
            })), null, 2));
            await engine.closeAll();
            if (results.length === 0) {
              throw new Error('No GDWEB smoke results found');
            }
          "
