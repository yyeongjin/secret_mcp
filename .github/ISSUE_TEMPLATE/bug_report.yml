name: Bug report
description: Report a problem with the MCP server
title: "[Bug]: "
labels:
  - bug
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What happened?
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction
      description: Steps, command, query, or MCP client configuration.
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: Paste relevant logs or errors.
      render: shell
  - type: input
    id: environment
    attributes:
      label: Environment
      description: OS, Node version, MCP client, and package version.
